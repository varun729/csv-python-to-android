plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

// Apply Chaquopy via legacy mechanism; version provided by root buildscript classpath
apply plugin: 'com.chaquo.python'

android {
    namespace 'net.vagrawal.android.csv_python_to_android'
    compileSdk 36

    defaultConfig {
        applicationId 'net.vagrawal.android.csv_python_to_android'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Required by Chaquopy: specify the ABIs to build for
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation(libs.androidx.core.ktx)
    implementation(libs.androidx.appcompat)
    implementation(libs.material)
    implementation(libs.androidx.recyclerview)
    implementation(libs.androidx.constraintlayout)
    implementation(libs.androidx.lifecycle.livedata.ktx)
    implementation(libs.androidx.lifecycle.viewmodel.ktx)
    implementation(libs.androidx.navigation.fragment.ktx)
    implementation(libs.androidx.navigation.ui.ktx)
    testImplementation(libs.junit)
    androidTestImplementation(libs.androidx.junit)
    androidTestImplementation(libs.androidx.espresso.core)
}

// Chaquopy: bundle Python packages in the APK (configure under defaultConfig)
chaquopy {
    defaultConfig {
        // Use a managed Python to avoid requiring a local interpreter during build
        // Let Chaquopy download a supported 3.11.x which is compatible for .pyc compilation
        buildPython '/opt/homebrew/bin/python3.11'
        // Ensure Android runtime Python matches buildPython minor version
        version '3.11'
        pip {
            install 'numpy'
            install 'pandas'
            install 'matplotlib'
            install 'pillow'
        }
    }
}
